<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Sephoc Motors Uganda</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="section">
  <div class="container">
    <div class="section-heading"><h2>Get in Touch</h2></div>
    <p style="color:var(--text-dim);max-width:520px;">
      Cadam Entreprises, Naguru — off Lugogo Bypass, Kampala, Uganda
    </p>

    <div class="contact-layout">
      <form class="contact-form" id="contact-form">
        <label>Name
          <input type="text" id="cf-name" placeholder="Your name" required>
        </label>
        <label>Phone
          <input type="tel" id="cf-phone" placeholder="Your phone number" required>
        </label>
        <label>Message
          <textarea id="cf-message" rows="4" placeholder="What are you looking for?"></textarea>
        </label>
        <div class="contact-actions">
          <button type="button" class="btn-whatsapp" id="cf-whatsapp">Send via WhatsApp</button>
          <a class="btn-call" href="tel:+256704113590">Call Us</a>
          <button type="button" class="btn-email" id="cf-email">Send via Email</button>
        </div>
      </form>

      <div class="contact-side">
        <div class="contact-block">
          <h4>Hours</h4>
          <p>Mon–Sat, 8:30am–6:00pm</p>
        </div>
        <div class="contact-block">
          <h4>Follow Us</h4>
          <a href="https://www.instagram.com/sephocmotorsuganda" target="_blank" rel="noopener">Instagram — @sephocmotorsuganda</a>
        </div>
      </div>
    </div>

    <div class="map-embed">
      <iframe src="https://www.google.com/maps?q=Naguru,Kampala,Uganda&output=embed" loading="lazy"></iframe>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<a class="chat-bubble" href="https://wa.me/256704113590" target="_blank" rel="noopener">&#128172;</a>

<script src="cars-data.js"></script>
<script src="partials.js"></script>
<script src="main.js"></script>
<script>
  renderHeader("contact.html");
  renderFooter();
  initContactPage();
</script>
</body>
</html>
