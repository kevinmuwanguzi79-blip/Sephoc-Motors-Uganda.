<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sephoc Motors Uganda | Buy &amp; Sell Cars in Kampala</title>
<meta name="description" content="Sephoc Motors Uganda - a one-stop car shopping centre in Kampala. Browse our full inventory of quality used and new vehicles.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="hero">
  <div class="container">
    <div class="hero-top">
      <div class="hero-text">
        <h1>A one-stop car shopping centre in the country.</h1>
        <p>Even when you're after a Ferrari or a Rambo — get sorted at CADAM.</p>
        <div class="hero-actions">
          <a href="inventory.html" class="btn-teal">Find a Car</a>
          <a href="contact.html" class="btn-outline">Sell a Car</a>
        </div>
      </div>
      <div class="hero-photo" id="hero-photo"></div>
    </div>

    <div class="search-bar">
      <input type="text" id="home-search" placeholder="Search by make or model, e.g. Toyota Harrier">
      <select id="home-make"><option value="">All makes</option></select>
      <select id="home-price">
        <option value="">Any price</option>
        <option value="50">Under USh 50M</option>
        <option value="100">Under USh 100M</option>
        <option value="150">Under USh 150M</option>
        <option value="200">Under USh 200M</option>
      </select>
      <button id="home-search-btn">Search</button>
    </div>
  </div>
  <div class="container">
    <div class="brand-strip" id="brand-strip"></div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-heading">
      <h2>Most Viewed</h2>
      <div class="sub">Freshly landed vehicles, ready to view</div>
    </div>
    <div class="car-grid" id="most-viewed-grid"></div>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="container">
    <div class="stock-banner">
      <strong>We have over 400+ vehicles in stock</strong>
      <a href="inventory.html" class="btn-teal">View All Cars</a>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-heading"><h2>Get in Touch</h2></div>
    <div class="map-embed">
      <iframe src="https://www.google.com/maps?q=Naguru,Kampala,Uganda&output=embed" loading="lazy"></iframe>
    </div>
    <div class="contact-actions">
      <a class="btn-whatsapp" href="https://wa.me/256704113590" target="_blank" rel="noopener">WhatsApp Us</a>
      <a class="btn-call" href="tel:+256704113590">Call Us</a>
      <a class="btn-email" href="mailto:info@sephocmotors.com">Email Us</a>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<a class="chat-bubble" href="https://wa.me/256704113590" target="_blank" rel="noopener">&#128172;</a>

<script src="cars-data.js"></script>
<script src="partials.js"></script>
<script src="main.js"></script>
<script>
  renderHeader("index.html");
  renderFooter();
  initHomePage();
</script>
</body>
</html>
